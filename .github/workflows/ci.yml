name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rozgar
          POSTGRES_PASSWORD: rozgar_test_only
          POSTGRES_DB: rozgar_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U rozgar -d rozgar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check app database.py alembic tests scripts
      - run: pytest -q
      - run: python scripts/benchmark_search.py
      - run: docker build -t rozgar-backend-check .
