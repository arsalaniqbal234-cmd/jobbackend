[project]
name = "rozgar-api"
version = "0.8.1"
requires-python = ">=3.11,<3.15"
# Vercel selects pyproject.toml ahead of requirements.txt. Keep the runtime
# dependency declarations aligned; tests/test_packaging.py checks this contract.
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
  "SQLAlchemy==2.0.51",
  "psycopg2-binary==2.9.12",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "APScheduler==3.10.4",
  "alembic==1.20.0",
  "email-validator==2.3.0",
  "PyJWT[crypto]==2.14.0",
  "redis==6.4.0",
  "sentry-sdk[fastapi]==2.69.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
